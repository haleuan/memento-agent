[project]
name = "memento-agent"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.35.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
memento = "mementoagent.cli:main"
mementoagent = "mementoagent.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mementoagent"

[tool.pyright]
stubPath = "typings"
typeCheckingMode = "standard"
include = ["src/mementoagent"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["D"]
# ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.17.2",
    "pyright>=1.1.0",
]
